<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>A股投资研究知识库</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-button" id="menuButton" type="button" aria-label="打开目录" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <a class="brand" href="#global-01" aria-label="返回知识库首页">
        <span class="brand-mark">研</span>
        <span class="brand-text">A股投资研究知识库</span>
      </a>
    </div>
    <div class="topbar-meta" id="topbarMeta">个人长期积累 · Markdown 驱动 · v1.1.0</div>
  </header>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="知识库目录">
      <div class="search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m1.35-5.15a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0Z"/></svg>
        <input id="searchInput" type="search" placeholder="搜索文档或股票…" autocomplete="off">
      </div>
      <nav class="nav-tree" id="navTree"></nav>
      <div class="sidebar-footer">
        <span>只做一个阅读页面，内容由 Markdown 驱动</span>
      </div>
    </aside>

    <button class="sidebar-overlay" id="sidebarOverlay" type="button" aria-label="关闭目录"></button>

    <main class="content" id="content">
      <div class="content-inner">
        <article class="document" id="document" aria-live="polite">
          <div class="loading-state">
            <span class="loading-dot"></span>
            <span>正在加载知识库…</span>
          </div>
        </article>
      </div>
    </main>
  </div>

  <script src="assets/vendor/marked.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
